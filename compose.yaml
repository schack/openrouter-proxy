---
services:
  openrouter-proxy:
    build: .
    image: openrouter-proxy:local
    restart: unless-stopped
    ports:
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${PROXY_PORT:-8080}:8080"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - caddy_config:/config
      - caddy_data:/data

volumes:
  caddy_config:
  caddy_data:
