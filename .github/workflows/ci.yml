---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Well-formed but nonexistent, so OpenRouter answers "User not found."
      # only if the proxy actually sent it.
      OPENROUTER_API_KEY: sk-or-v1-0
      PROXY_IMAGE: openrouter-proxy:ci
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        # yamllint disable-line rule:line-length
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build image
        run: docker build -t "$PROXY_IMAGE" .

      - name: Report container vulnerabilities
        # yamllint disable-line rule:line-length
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.PROXY_IMAGE }}
          version: v0.74.0
          scanners: vuln
          format: table
          exit-code: "0"
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Block fixable high and critical vulnerabilities
        run: |
          trivy image --image-src docker --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$PROXY_IMAGE"

      - name: Validate Caddyfile
        run: |
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -e OPENROUTER_API_KEY "$PROXY_IMAGE" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e OPENROUTER_API_KEY "$PROXY_IMAGE" \
            fmt /etc/caddy/Caddyfile | cmp - Caddyfile

      - name: Check proxy routing and request headers
        run: |
          docker run --rm -e OPENROUTER_API_KEY "$PROXY_IMAGE" \
            adapt --config /etc/caddy/Caddyfile --adapter caddyfile | \
            jq -e --arg auth "Bearer $OPENROUTER_API_KEY" '
              (.admin.disabled == true) and
              (.admin.config.persist == false) and
              (.apps.http.servers.srv0.routes[0].handle[0] |
                .handler == "reverse_proxy" and
                .upstreams == [{"dial": "openrouter.ai:443"}] and
                .transport.tls == {} and
                .headers.request.set.Authorization == [$auth] and
                (["X-API-Key", "X-Forwarded-For", "X-Forwarded-Host",
                  "X-Forwarded-Proto", "Via"] -
                  .headers.request.delete == []))' > /dev/null

      - name: Start and check hardened container
        run: |
          docker compose up --pull never -d
          docker compose ps --status running --quiet | grep -q .
          body=$(curl --silent --show-error --max-time 30 \
            --retry 10 --retry-all-errors --retry-delay 1 \
            -H 'Authorization: Bearer client-supplied' \
            -H 'X-API-Key: client-supplied' \
            http://127.0.0.1:8080/api/v1/auth/key)
          jq -e '.error.message == "User not found."' <<<"$body" \
            > /dev/null || {
            echo "Unexpected response: $body"
            exit 1
          }

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop container
        if: always()
        run: docker compose down

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        # yamllint disable-line rule:line-length
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0
        with:
          platforms: arm64

      - name: Set up Buildx
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GitHub Container Registry
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        # yamllint disable-line rule:line-length
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Install cosign
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
