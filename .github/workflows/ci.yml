---
name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Well-formed but nonexistent, so OpenRouter answers "User not found."
      # only if the proxy actually sent it.
      OPENROUTER_API_KEY: sk-or-v1-0
      PROXY_IMAGE: openrouter-proxy:ci
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate Caddy version release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          caddy_version=$(sed -nE \
            's/^FROM caddy:([0-9.]+)-alpine.*/\1/p' \
            Dockerfile)
          if [[ -z "$caddy_version" ]] ||
            [[ "$tag_version" != "$caddy_version" ]]; then
            echo "Release tag does not match the pinned Caddy version."
            echo "Tag: $GITHUB_REF_NAME, Dockerfile: ${caddy_version:-none}"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main"
            exit 1
          fi

      - name: Lint Dockerfile
        # yamllint disable-line rule:line-length
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build image
        run: docker build -t "$PROXY_IMAGE" .

      - name: Report container vulnerabilities
        # yamllint disable-line rule:line-length
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.PROXY_IMAGE }}
          version: v0.74.0
          scanners: vuln
          format: table
          exit-code: "0"
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Block fixable high and critical vulnerabilities
        run: |
          trivy image --image-src docker --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$PROXY_IMAGE"

      - name: Validate Caddyfile
        run: |
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -e OPENROUTER_API_KEY "$PROXY_IMAGE" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e OPENROUTER_API_KEY "$PROXY_IMAGE" \
            fmt /etc/caddy/Caddyfile | cmp - Caddyfile

      - name: Check proxy routing and request headers
        run: |
          docker run --rm -e OPENROUTER_API_KEY "$PROXY_IMAGE" \
            adapt --config /etc/caddy/Caddyfile --adapter caddyfile | \
            jq -e --arg auth "Bearer $OPENROUTER_API_KEY" '
              (.admin.disabled == true) and
              (.admin.config.persist == false) and
              (.apps.http.servers.srv0.routes[0].handle[0] |
                .handler == "reverse_proxy" and
                .upstreams == [{"dial": "openrouter.ai:443"}] and
                .transport.tls == {} and
                .headers.request.set.Authorization == [$auth] and
                (["X-API-Key", "X-Forwarded-For", "X-Forwarded-Host",
                  "X-Forwarded-Proto", "Via"] -
                  .headers.request.delete == []))' > /dev/null

      - name: Start and check hardened container
        run: |
          docker compose up --pull never -d
          docker compose ps --status running --quiet | grep -q .
          body=$(curl --silent --show-error --max-time 30 \
            --retry 10 --retry-all-errors --retry-delay 1 \
            -H 'Authorization: Bearer client-supplied' \
            -H 'X-API-Key: client-supplied' \
            http://127.0.0.1:8080/api/v1/auth/key)
          jq -e '.error.message == "User not found."' <<<"$body" \
            > /dev/null || {
            echo "Unexpected response: $body"
            exit 1
          }

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop container
        if: always()
        run: docker compose down

  publish:
    needs: check
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        # yamllint disable-line rule:line-length
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Log in to GitHub Container Registry
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image-tags
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags="$IMAGE:latest"
            tags+=$'\n'"$IMAGE:sha-$GITHUB_SHA"
          else
            tags="$IMAGE:${GITHUB_REF_NAME#v}"
          fi
          {
            printf 'tags<<EOF\n'
            printf '%s\n' "$tags"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        # yamllint disable-line rule:line-length
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

      - name: Install cosign
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes
